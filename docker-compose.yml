name: damdai-min

services:
  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  fake-gcs:
    image: fsouza/fake-gcs-server:1.52.3
    command:
      [
        '-scheme',
        'http',
        '-port',
        '4443',
        '-backend',
        'filesystem',
        '-filesystem-root',
        '/data',
        '-cors-headers',
        'content-type,origin',
      ]
    ports:
      - '4443:4443'
    volumes:
      - fake-gcs-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:4443/storage/v1/b || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - '4317:4317'
      - '4318:4318'
      - '13133:13133'
    healthcheck:
      test: ['CMD', '/otelcol-contrib', '--version']
      interval: 5s
      timeout: 3s
      retries: 10

  research-fake:
    build:
      context: .
      dockerfile: Dockerfile
    command: ['node', 'services/research-fake/dist/main.js']
    environment:
      RESEARCH_FAKE_HOST: 0.0.0.0
      RESEARCH_FAKE_PORT: 4100
    ports:
      - '4101:4100'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4100/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  research-engine:
    build:
      context: ./services/research-engine
      dockerfile: Dockerfile
    environment:
      RESEARCH_ENGINE_HOST: 0.0.0.0
      RESEARCH_ENGINE_PORT: 4100
      TSERA_SOURCE_DIR: /app/vendor/tsera/src
      TSERA_MODEL_PATH: /app/vendor/tsera/src/models/best_finetuned_baseline.pt
      SYMBOLIC_KEYWORD_DIR: /app/vendor/tsera/data/raw/keywords
      ASR_MODEL: ${ASR_MODEL:-large-v3-turbo}
      ASR_LANGUAGE: ${ASR_LANGUAGE:-auto}
      ASR_DEVICE: ${ASR_DEVICE:-cpu}
      ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE:-int8}
      HF_TOKEN: ${HF_TOKEN:-}
      NEURAL_FUSION_WEIGHT: ${NEURAL_FUSION_WEIGHT:-0.60}
      SYMBOLIC_FUSION_WEIGHT: ${SYMBOLIC_FUSION_WEIGHT:-0.40}
      RULE_WEIGHT_AGREEMENT: ${RULE_WEIGHT_AGREEMENT:-2.50}
    volumes:
      - ./services/research-engine/main.py:/app/main.py:ro
      - ./services/research-engine/audio_windows.py:/app/audio_windows.py:ro
      - ./.cache/huggingface:/root/.cache/huggingface
    ports:
      - '4100:4100'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:4100/healthz', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ['node', 'apps/api/dist/main.js']
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 4000
      CORS_ALLOWED_ORIGIN: http://localhost:3000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NEON_AUTH_BASE_URL: ${NEON_AUTH_BASE_URL:?NEON_AUTH_BASE_URL is required}
      NEON_AUTH_JWKS_URL: ${NEON_AUTH_JWKS_URL:?NEON_AUTH_JWKS_URL is required}
      NEON_AUTH_ISSUER: ${NEON_AUTH_ISSUER:?NEON_AUTH_ISSUER is required}
      NEON_AUTH_AUDIENCE: ${NEON_AUTH_AUDIENCE:?NEON_AUTH_AUDIENCE is required}
      REDIS_URL: redis://redis:6379
      RESEARCH_SYSTEM_URL: http://research-engine:4100
      GCS_ENDPOINT: http://fake-gcs:4443
      GCS_PUBLIC_ENDPOINT: http://localhost:4443
      GCS_PROJECT_ID: damdai-local
      GCS_SOURCE_BUCKET: damdai-source-audio
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      redis:
        condition: service_healthy
      fake-gcs:
        condition: service_healthy
      research-engine:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    ports:
      - '4000:4000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ['node', 'apps/worker/dist/main.js']
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: redis://redis:6379
      RESEARCH_SYSTEM_URL: http://research-engine:4100
      GCS_ENDPOINT: http://fake-gcs:4443
      GCS_PROJECT_ID: damdai-local
      GCS_SOURCE_BUCKET: damdai-source-audio
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      redis:
        condition: service_healthy
      fake-gcs:
        condition: service_healthy
      research-engine:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: ['pnpm', '--filter', '@damdai/web', 'run', 'start']
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v2
      NEON_AUTH_BASE_URL: ${NEON_AUTH_BASE_URL:?NEON_AUTH_BASE_URL is required}
      NEON_AUTH_COOKIE_SECRET: ${NEON_AUTH_COOKIE_SECRET:?NEON_AUTH_COOKIE_SECRET is required}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
  fake-gcs-data:
